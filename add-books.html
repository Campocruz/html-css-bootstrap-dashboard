<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Book</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

  <header>
    <!-- Navbar header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href='index.html'>
          <img src="./assets/logo/duck.png" alt="Bootstrap" width="40" height="40">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Catalogo Libri</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="userinfo.html">Anagrafica Utenti</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="rentaltrend.html">Storico Prestiti</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="help.html">Help</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="cerca" aria-label="cerca" />
            <button class="btn btn-outline-light" type="submit">cerca</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <!-- Middle Container -->
    <div class="container-xl">
      <form>
        <legend>Nuovo Libro</legend>
        <!-- Row 1 -->
        <div class="row">
          <div class="col-6">
            <div class="mb-3">
              <label for="disabledTextInput" class="form-label">Nome Autore</label>
              <input type="text" id="disabledTextInput" class="form-control"
                placeholder="Inserisci il nome dell'autore">
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="disabledTextInput" class="form-label">Cognome Autore</label>
              <input type="text" id="disabledTextInput" class="form-control"
                placeholder="Inserisci il cognome dell'autore">
            </div>
          </div>
          <div class="col-12">
            <div class="mb-3">
              <label for="disabledTextInput" class="form-label">Titolo</label>
              <input type="text" id="disabledTextInput" class="form-control"
                placeholder="Inserisci il titolo dell'autore">
            </div>
          </div>
          <div class="col-12 col-lg-4">
            <div class="mb-3">
              <label for="disabledSelect" class="form-label">Genere</label>
              <select id="disabledSelect" class="form-select">
                <option>Scegliere il genere</option>
                <option>Fantasy</option>
                <option>Gialli</option>
                <option>Horror</option>
              </select>
            </div>
          </div>
          <div class="col-12 col-lg-4">
            <div class="mb-3">
              <label for="disabledTextInput" class="form-label">Anno di Publicazione</label>
              <input type="text" id="disabledTextInput" class="form-control" placeholder="Inserisci l'anno">
            </div>
          </div>
          <div class="col-12 col-lg-4">
            <div class="mb-3">
              <label for="disabledTextInput" class="form-label">ISBN#</label>
              <input type="text" id="disabledTextInput" class="form-control" placeholder="Inserisci il codice ISBN#">
            </div>
          </div>
        </div>
        <hr>
        <div class="row">
          <div class="col-12">
            <div class="form-floating ">
              <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
              <label for="floatingTextarea">Inserisci eventualmenti note sul libro</label>
            </div>
          </div>
          <div class="col-12">
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" id="gridCheck">
              <label class="form-check-label" for="gridCheck">
                Check me out
              </label>
            </div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary mt-4">Aggiungi Libro</button>
          </div>
        </div>
      </form>
    </div>

  </main>

</body>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</html>
